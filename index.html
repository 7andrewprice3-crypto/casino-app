<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Narrow Way — Panel World</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 0;
    }
    .frame {
      width: 960px;
      max-width: 100%;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
      padding: 16px 18px 22px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 1rem;
      color: #a5b4fc;
    }
    .stats {
      font-size: 0.8rem;
      color: #9ca3af;
    }
    .stats span { margin-left: 10px; }
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(148, 163, 184, 0.7), transparent);
      margin: 8px 0 10px;
    }
    .panel-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: #000;
    }
    .panel-img {
      width: 100%;
      display: block;
      max-height: 480px;
      object-fit: cover;
    }
    .overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.1));
      pointer-events: none;
    }
    .caption {
      position: absolute;
      left: 16px;
      bottom: 14px;
      right: 16px;
      pointer-events: none;
    }
    .caption-title {
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c4b5fd;
      margin-bottom: 4px;
    }
    .caption-text {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #e5e7eb;
    }
    .caption-verse {
      font-size: 0.8rem;
      color: #a5b4fc;
      margin-top: 4px;
      font-style: italic;
    }
    .hotspot {
      position: absolute;
      border-radius: 6px;
      border: 1px solid rgba(248, 250, 252, 0.7);
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.9);
      cursor: pointer;
      background: rgba(15, 23, 42, 0.25);
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    }
    .hotspot:hover {
      background: rgba(129, 140, 248, 0.35);
      box-shadow: 0 0 0 2px rgba(129, 140, 248, 0.9);
      transform: translateY(-1px);
    }
    .hotspot-label {
      position: absolute;
      bottom: 4px;
      left: 4px;
      right: 4px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #e5e7eb;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(15, 23, 42, 0.9);
    }
    .meta {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="frame">
  <div class="header">
    <h1>The Narrow Way — Panel World</h1>
    <div class="stats" id="stats"></div>
  </div>
  <div class="divider"></div>

  <div id="panel-container"></div>
  <div id="meta" class="meta"></div>
</div>

<script>
  const state = {
    faith: 0,
    gratitude: 0,
    understanding: 0,
    surrender: 0
  };

  function renderStats() {
    document.getElementById("stats").innerHTML = `
      <span>Faith: ${state.faith}</span>
      <span>Gratitude: ${state.gratitude}</span>
      <span>Understanding: ${state.understanding}</span>
      <span>Surrender: ${state.surrender}</span>
    `;
  }

  const panels = {
    // 1. ROOM WITH DOOR (YOU)
    "room_start": {
      img: "https://images.pexels.com/photos/1571460/pexels-photo-1571460.jpeg",
      title: "Your Room — The Question",
      text: `
        You stand in a quiet room. A Bible rests on the table. A door stands slightly open,
        light spilling through the crack. You feel the pull to step out and follow.
      `,
      verse: `"Behold, I stand at the door, and knock…" (Revelation 3:20, KJV)`,
      meta: "Tap the door to step into His story, or linger and hesitate.",
      hotspots: [
        {
          // door area (approximate, in percentages)
          left: 62, top: 18, width: 18, height: 60,
          label: "Door",
          to: "bethlehem_street",
          effect: () => { state.faith += 1; }
        },
        {
          // Bible on table
          left: 20, top: 60, width: 18, height: 18,
          label: "Bible",
          to: "room_bible",
          effect: () => { state.understanding += 1; }
        }
      ]
    },

    "room_bible": {
      img: "https://images.pexels.com/photos/267559/pexels-photo-267559.jpeg",
      title: "The Word in Your Hands",
      text: `
        You open the Bible. The words are old, but alive.
        You read of Christ, of His birth, His cross, His empty tomb.
        The door in your room feels less like an exit and more like a calling.
      `,
      verse: `"Search the scriptures… they are they which testify of me." (John 5:39, KJV)`,
      meta: "You can return to the room, or step through the door.",
      hotspots: [
        {
          left: 5, top: 5, width: 20, height: 15,
          label: "Back",
          to: "room_start",
          effect: () => {}
        },
        {
          left: 70, top: 65, width: 22, height: 25,
          label: "Go to Door",
          to: "room_start",
          effect: () => { state.faith += 1; }
        }
      ]
    },

    // 2. BETHLEHEM STREET
    "bethlehem_street": {
      img: "https://images.pexels.com/photos/71241/bethlehem-church-of-the-nativity-71241.jpeg",
      title: "Bethlehem — God With Us",
      text: `
        You step through the door and find yourself on a stone street under a night sky.
        A simple house glows with warm light. Inside, the Child has been born.
      `,
      verse: `"For unto you is born this day… a Saviour, which is Christ the Lord." (Luke 2:11, KJV)`,
      meta: "Tap the lit doorway to draw near, or explore the street.",
      hotspots: [
        {
          // lit doorway
          left: 38, top: 40, width: 18, height: 30,
          label: "Doorway",
          to: "bethlehem_inside",
          effect: () => { state.gratitude += 1; state.faith += 1; }
        },
        {
          // path leading away (to Jordan)
          left: 5, top: 70, width: 20, height: 20,
          label: "Road",
          to: "jordan_bank",
          effect: () => { state.understanding += 1; }
        },
        {
          // back to your room
          left: 80, top: 5, width: 15, height: 15,
          label: "Back",
          to: "room_start",
          effect: () => {}
        }
      ]
    },

    "bethlehem_inside": {
      img: "https://images.pexels.com/photos/71241/bethlehem-church-of-the-nativity-71241.jpeg",
      title: "Before the Manger",
      text: `
        You kneel in a small, humble space. No throne, no crown of gold.
        Yet here lies the King of kings, wrapped in cloth, laid in a manger.
      `,
      verse: `"And they came with haste, and found Mary, and Joseph, and the babe lying in a manger." (Luke 2:16, KJV)`,
      meta: "You can linger in worship, or follow His life forward.",
      hotspots: [
        {
          left: 10, top: 70, width: 25, height: 20,
          label: "Worship",
          to: "bethlehem_inside",
          effect: () => { state.gratitude += 1; state.faith += 1; }
        },
        {
          left: 65, top: 65, width: 25, height: 25,
          label: "Follow",
          to: "jordan_bank",
          effect: () => { state.faith += 1; }
        }
      ]
    },

    // 3. JORDAN RIVER
    "jordan_bank": {
      img: "https://images.pexels.com/photos/460376/pexels-photo-460376.jpeg",
      title: "Jordan — Baptism",
      text: `
        You stand by the river. Jesus steps into the water among those confessing their sins.
        As He is baptized, heaven opens, and the Father's voice declares Him beloved.
      `,
      verse: `"This is my beloved Son, in whom I am well pleased." (Matthew 3:17, KJV)`,
      meta: "Tap the water to reflect on His humility, or the path to follow Him into the wilderness.",
      hotspots: [
        {
          left: 10, top: 60, width: 35, height: 30,
          label: "Water",
          to: "jordan_bank",
          effect: () => { state.understanding += 1; }
        },
        {
          left: 70, top: 55, width: 20, height: 30,
          label: "Path",
          to: "wilderness_rocks",
          effect: () => { state.faith += 1; }
        },
        {
          left: 5, top: 5, width: 15, height: 15,
          label: "Map",
          to: "room_start",
          effect: () => {}
        }
      ]
    },

    // 4. WILDERNESS
    "wilderness_rocks": {
      img: "https://images.pexels.com/photos/240040/pexels-photo-240040.jpeg",
      title: "Wilderness — Temptation",
      text: `
        Stones, heat, silence. Here Jesus is tempted to take shortcuts:
        bread without trust, glory without obedience, power without the cross.
        He answers each with, "It is written…"
      `,
      verse: `"Man shall not live by bread alone…" (Matthew 4:4, KJV)`,
      meta: "Tap the distant ridge to move toward Galilee, or the stones to meditate on His obedience.",
      hotspots: [
        {
          left: 10, top: 65, width: 30, height: 25,
          label: "Stones",
          to: "wilderness_rocks",
          effect: () => { state.understanding += 1; state.faith += 1; }
        },
        {
          left: 60, top: 20, width: 30, height: 25,
          label: "Ridge",
          to: "galilee_shore",
          effect: () => { state.faith += 1; }
        }
      ]
    },

    // 5. GALILEE
    "galilee_shore": {
      img: "https://images.pexels.com/photos/460376/pexels-photo-460376.jpeg",
      title: "Galilee — Follow Me",
      text: `
        Waves lap at the shore. Fishermen mend their nets.
        Jesus walks by and says, "Follow me, and I will make you fishers of men."
      `,
      verse: `"And they straightway left their nets, and followed him." (Matthew 4:20, KJV)`,
      meta: "Tap the boat to stay with your old life, or the path beside Him to follow.",
      hotspots: [
        {
          left: 10, top: 60, width: 30, height: 25,
          label: "Boat",
          to: "galilee_shore",
          effect: () => { state.understanding += 1; }
        },
        {
          left: 60, top: 55, width: 30, height: 30,
          label: "Follow",
          to: "gethsemane_garden",
          effect: () => { state.surrender += 1; state.faith += 1; }
        }
      ]
    },

    // 6. GETHSEMANE
    "gethsemane_garden": {
      img: "https://images.pexels.com/photos/3408744/pexels-photo-3408744.jpeg",
      title: "Gethsemane — Not My Will",
      text: `
        Among the olive trees, under the weight of what is to come, Jesus prays in agony.
        He could turn away. Instead, He yields: "Not my will, but thine, be done."
      `,
      verse: `"Nevertheless not my will, but thine, be done." (Luke 22:42, KJV)`,
      meta: "Tap the ground to kneel with Him, or the gate to walk toward the cross.",
      hotspots: [
        {
          left: 20, top: 65, width: 30, height: 25,
          label: "Kneel",
          to: "gethsemane_garden",
          effect: () => { state.surrender += 1; }
        },
        {
          left: 70, top: 40, width: 20, height: 30,
          label: "Gate",
          to: "golgotha_hill",
          effect: () => { state.faith += 1; state.surrender += 1; }
        }
      ]
    },

    // 7. GOLGOTHA
    "golgotha_hill": {
      img: "https://images.pexels.com/photos/1615776/pexels-photo-1615776.jpeg",
      title: "Golgotha — The Cross",
      text: `
        The hill is stark against the sky. The cross stands at the center.
        Here, the sinless One bears the weight of sin, yours included.
      `,
      verse: `"Christ died for our sins according to the scriptures." (1 Corinthians 15:3, KJV)`,
      meta: "Tap the cross to look in repentance, or the distant garden to move toward the empty tomb.",
      hotspots: [
        {
          left: 40, top: 20, width: 20, height: 40,
          label: "Cross",
          to: "golgotha_hill",
          effect: () => { state.faith += 2; state.surrender += 2; state.gratitude += 2; }
        },
        {
          left: 70, top: 60, width: 20, height: 25,
          label: "Garden",
          to: "tomb_garden",
          effect: () => { state.faith += 1; }
        }
      ]
    },

    // 8. EMPTY TOMB
    "tomb_garden": {
      img: "https://images.pexels.com/photos/1615776/pexels-photo-1615776.jpeg",
      title: "The Empty Tomb — He Is Risen",
      text: `
        The stone is rolled away. The tomb is empty.
        Death could not hold Him. He is risen, as He said.
      `,
      verse: `"He is not here: for he is risen, as he said." (Matthew 28:6, KJV)`,
      meta: "Tap the entrance to rejoice, or the path leading out to choose the narrow way.",
      hotspots: [
        {
          left: 35, top: 45, width: 20, height: 30,
          label: "Entrance",
          to: "tomb_garden",
          effect: () => { state.gratitude += 2; state.faith += 2; }
        },
        {
          left: 65, top: 65, width: 25, height: 25,
          label: "Path",
          to: "narrow_gate",
          effect: () => { state.understanding += 1; }
        }
      ]
    },

    // 9. NARROW GATE (YOUR RESPONSE)
    "narrow_gate": {
      img: "https://images.pexels.com/photos/240040/pexels-photo-240040.jpeg",
      title: "The Narrow Way — Your Heart",
      text: `
        A small gate stands before you, easy to miss, yet clearly marked.
        You have walked through His story: birth, obedience, cross, empty tomb.
        Now the question is not what He has done, but whether you will trust Him.
      `,
      verse: `"Enter ye in at the strait gate…" (Matthew 7:13, KJV)`,
      meta: "Tap the gate to surrender and follow, or the side path to hesitate.",
      hotspots: [
        {
          left: 40, top: 35, width: 20, height: 40,
          label: "Gate",
          to: "walk_with_christ",
          effect: () => { state.surrender += 3; state.faith += 3; state.gratitude += 3; }
        },
        {
          left: 10, top: 70, width: 25, height: 20,
          label: "Side Path",
          to: "room_start",
          effect: () => { state.understanding += 1; }
        }
      ]
    },

    // 10. WALKING WITH CHRIST
    "walk_with_christ": {
      img: "https://images.pexels.com/photos/3408744/pexels-photo-3408744.jpeg",
      title: "Walking With Christ",
      text: `
        You entrust yourself to Him: His cross for your forgiveness, His resurrection for your life.
        Your creativity becomes worship, your learning becomes discipleship, your gratitude becomes a way of living.
        You are not alone; He walks with you.
      `,
      verse: `"Lo, I am with you alway, even unto the end of the world." (Matthew 28:20, KJV)`,
      meta: "You can revisit any panel, but now as one who belongs to Him.",
      hotspots: [
        {
          left: 10, top: 10, width: 25, height: 20,
          label: "Room",
          to: "room_start",
          effect: () => {}
        },
        {
          left: 65, top: 65, width: 25, height: 25,
          label: "Bethlehem",
          to: "bethlehem_street",
          effect: () => {}
        }
      ]
    }
  };

  function renderPanel(id) {
    const panel = panels[id];
    if (!panel) return;

    const container = document.getElementById("panel-container");
    const metaEl = document.getElementById("meta");

    let html = `
      <div class="panel-wrapper">
        <img class="panel-img" src="${panel.img}" alt="${panel.title}">
        <div class="overlay-gradient"></div>
        <div class="caption">
          <div class="caption-title">${panel.title}</div>
          <div class="caption-text">${panel.text}</div>
          <div class="caption-verse">${panel.verse || ""}</div>
        </div>
    `;

    (panel.hotspots || []).forEach((h, idx) => {
      html += `
        <div class="hotspot"
             style="left:${h.left}%; top:${h.top}%; width:${h.width}%; height:${h.height}%"
             data-index="${idx}">
          <div class="hotspot-label">${h.label}</div>
        </div>
      `;
    });

    html += `</div>`;
    container.innerHTML = html;
    metaEl.textContent = panel.meta || "";

    const hotspotEls = container.querySelectorAll(".hotspot");
    hotspotEls.forEach(el => {
      const idx = parseInt(el.getAttribute("data-index"), 10);
      const h = panel.hotspots[idx];
      el.onclick = () => {
        if (h.effect) h.effect();
        renderStats();
        renderPanel(h.to);
      };
    });

    renderStats();
  }

  renderStats();
  renderPanel("room_start");
</script>

</body>
</html>
